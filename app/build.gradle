apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'


android {
    compileSdk = 36
    defaultConfig {
        applicationId "com.myapp.lexicon"
        minSdkVersion 26
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 36
        versionName '5.14'   //Hint last versionName in store is 5.13
        versionCode 109      //Hint last versionCode in store is 108
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation":"$projectDir/schemas".toString(),
                        "room.incremental":"true",
                        "room.expandProjection":"true"]
            }
        }

        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())

        buildConfigField "String", "YOUTUBE_API_KEY", "\"${properties.getProperty("YOUTUBE_API_KEY")}\""
        buildConfigField "String", "BOT_TOKEN", "\"${properties.getProperty("BOT_TOKEN")}\""
        buildConfigField "String", "CHAT_ID", "\"${properties.getProperty("CHAT_ID")}\""
        buildConfigField "String", "PAYMENT_CODE", "\"${properties.getProperty("PAYMENT_CODE")}\""
        buildConfigField "String", "IS_IMPORTANT_UPDATE", "\"${properties.getProperty("IS_IMPORTANT_UPDATE")}\""
        buildConfigField "String", "ADS_KEY", "\"${properties.getProperty("ADS_KEY")}\""
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    flavorDimensions = ['ADS_TEST']
    productFlavors {
        TEST_ADS {
            dimension 'ADS_TEST'
            buildConfigField 'String', 'ADS_SOURCE', '\"TEST_AD\"'
        }
        ALIVE_ADS {
            dimension 'ADS_TEST'
            buildConfigField 'String', 'ADS_SOURCE', '\"ALIVE_AD\"'
        }
        LOCAL_HOST {
            dimension 'ADS_TEST'
            buildConfigField('String', 'ADS_SOURCE', '\"LOCAL_HOST\"')
        }
    }
    testOptions.unitTests.includeAndroidResources = true

    namespace 'com.myapp.lexicon'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'com.google.android.gms:play-services-auth-base:18.3.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    testImplementation "android.arch.core:core-testing:1.1.1"
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:truth:1.7.0'
    testImplementation 'com.google.truth:truth:1.4.4'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation 'androidx.test.ext:junit-ktx:1.3.0'

    //Robolectric
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'org.robolectric:annotations:4.15.1'

    implementation 'androidx.multidex:multidex:2.0.1'

    //ViewPager2
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    //firebase
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'androidx.browser:browser:1.9.0'

    //region Room
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    //noinspection KaptUsageInsteadOfKsp
    kapt "androidx.room:room-compiler:2.7.2"
    // optional - Test helpers
    testImplementation 'androidx.room:room-testing:2.7.2'
    //endregion

    //reactivex
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.jakewharton.rxbinding2:rxbinding:2.2.0'
    implementation 'androidx.room:room-rxjava2:2.7.2'

    //jsoup
    implementation 'org.jsoup:jsoup:1.21.1'

    //region Hint Activity Result API. Runtime permission Step 1
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    //endregion

    //WorkManager library
    def work_version = "2.10.3"
    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:$work_version"
    // optional - GCMNetworkManager support
    implementation "androidx.work:work-gcm:$work_version"
    // optional - Test helpers
    testImplementation "androidx.work:work-testing:$work_version"

    // Appodeal
    implementation("com.appodeal.ads:sdk:3.8.1.0") {
        exclude group: "com.appodeal.ads.sdk.services", module: "adjust"
        exclude group: "com.appodeal.ads.sdk.services", module: "appsflyer"
        exclude group: "com.appodeal.ads.sdk.services", module: "facebook_analytics"
        exclude group: "com.appodeal.ads.sdk.services", module: "firebase"
    }

    //FormatEditText
    implementation 'com.github.dkzwm:fet-core:0.2.1'

    //Kotlin Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.9.0'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")

    //back4app
    implementation "com.github.parse-community.Parse-SDK-Android:parse:4.3.0"

    // Picasso
    implementation 'com.squareup.picasso:picasso:2.71828'

    // In-app update
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

}


